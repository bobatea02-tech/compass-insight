version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=postgresql+asyncpg://compass:compass@postgres/compass
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=${FRONTEND_URL:-}
    volumes:
      - ./backend/chroma_db:/app/chroma_db
      - ./backend/ml/models:/app/ml/models
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: compass
      POSTGRES_PASSWORD: compass
      POSTGRES_DB: compass
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 20mb --maxmemory-policy allkeys-lru

volumes:
  pgdata:
